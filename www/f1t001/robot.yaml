# For more details on the format and content:
# https://github.com/robocorp/rcc/blob/master/docs/recipes.md#what-is-in-robotyaml

tasks:
  prep:
    shell: sh -c "mkdir -p \"${LOG_BASE}log/prep\" && python -m robocorp.tasks run tasks.py -t prep -o log/prep 2>&1 | tee \"${LOG_BASE}log/prep/stdout_$(date +%Y-%m-%d_%H-%M-%S).log\"" 
  Dolog:
    shell: sh -c "mkdir -p \"${LOG_BASE}log/Dolog\" && python -m robocorp.tasks run tasks.py -t Dolog -o log/Dolog 2>&1 | tee \"${LOG_BASE}log/Dolog/stdout.log\""
  Dev:
    shell: python -m robocorp.tasks run tasks.py -t prep

environmentConfigs:
  - environment_windows_amd64_freeze.yaml
  - environment_linux_amd64_freeze.yaml
  - environment_darwin_amd64_freeze.yaml
  - conda.yaml

artifactsDir: log

PATH:
  - .
PYTHONPATH:
  - .
ignoreFiles:
  - .gitignore

logging:
  limit: 10000  # Domyślnie 2000 linii
  max_log_file_size: 10MB #domyslenie 1MB
  max-log-files: 10 # domyslenie 10 
