# For more details on the format and content:
# https://github.com/robocorp/rcc/blob/master/docs/recipes.md#what-is-in-condayaml
# Tip: Adding a link to the release notes of the packages helps maintenance and security.
# Comment tesseract and rpaframework-recognition libraries if not use ocr and working through RDP

channels:
  - conda-forge

dependencies:
  - python=3.12.13                # https://pyreadiness.org/3.10
  - pip=25.3                      # https://pip.pypa.io/en/stable/news
  - robocorp-truststore=0.8.0     # https://pypi.org/project/robocorp-truststore/
  # - tesseract                   # https://anaconda.org/conda-forge/tesseract
  - pip:
    - rpaframework==31.2.0        # https://rpaframework.org/releasenotes.html
    - robocorp==3.1.1             # https://pypi.org/project/robocorp
    - robocorp-browser==2.4.0     # https://pypi.org/project/robocorp-browser
    - python-i18n[yaml]==0.3.9    # https://pypi.org/project/python-i18n/
    - python-json-logger==4.1.0   # https://pypi.org/project/python-json-logger/
    - python-dotenv==1.2.2        # .env
    - openpyxl==3.2.0b1           # read excel files
    # - rpaframework-recognition==7.0.2 # https://pypi.org/project/rpaframework-recognition/
    - msoffcrypto-tool==6.0.0     # https://pypi.org/project/msoffcrypto-tool/
    # - msgraph-sdk==1.56.0       # https://pypi.org/project/msgraph-sdk/
    # - azure-identity==1.25.3    # https://pypi.org/project/azure-identity/
